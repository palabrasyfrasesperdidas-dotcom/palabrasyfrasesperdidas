<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabras y frases perdidas | Lost Words and Phrases</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.1rem;
            margin-bottom: 3px;
            color: #e0e0e0;
        }
        p.subtitle {
            font-size: 1rem;
            color: #888888;
            margin-bottom: 15px;
        }
        .intro-container {
            width: 100%;
            max-width: 620px;
            margin-bottom: 15px;
        }
        .intro-video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.85);
            background: #000;
        }
        .intro-video-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .nav-container {
            width: 100%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        /* Botón destacado del libro en venta */
        .book-btn {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            background-color: #5a1818;
            border: 1px solid #8b2626;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .book-btn:hover {
            background-color: #721d1d;
            border-color: #a53232;
            transform: translateY(-2px);
        }
        /* Cuadrícula de idiomas (Grid) */
        .lang-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .lang-grid a {
            padding: 10px 15px;
            font-size: 0.95rem;
            font-weight: 600;
            background-color: #1f1f1f;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .lang-grid a:hover {
            background-color: #333;
            border-color: #777;
            transform: translateY(-2px);
        }
        /* Adaptación automática para pantallas móviles pequeñas (WAP/Móvil) */
        @media (max-width: 580px) {
            h1 { font-size: 1.7rem; }
            p.subtitle { font-size: 0.9rem; margin-bottom: 10px; }
            .intro-container { max-width: 100%; margin-bottom: 10px; }
            .lang-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .lang-grid a, .book-btn {
                padding: 9px 10px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <h1>Palabras y frases perdidas</h1>
    <p class="subtitle">Colección de huellas y reflexiones</p>

    <div class="intro-container">
        <div class="intro-video-wrapper">
            <video autoplay loop muted playsinline>
                <source src="Intro PYFP.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de este vídeo.
            </video>
        </div>
    </div>

    <div class="nav-container">
        <!-- Botón superior exclusivo para el libro en venta -->
        <a href="URL_DEL_LIBRO_AQUI" class="book-btn">📖 Libro en venta</a>

        <!-- Cuadrícula ordenada de 6 idiomas -->
        <div class="lang-grid">
            <a href="https://palabrasyfrasesperdidas-dotcom.github.io/palabras-es/">🇪🇸 Español</a>
            <a href="https://palabrasyfrasesperdidas-dotcom.github.io/palabras-en/">🇬🇧 English</a>
           <a href="https://palabrasyfrasesperdidas-dotcom.github.io/palabras-jp/">🇯🇵 日本語</a>
            <a href="#" style="opacity: 0.4; pointer-events: none;">🇫🇷 Français</a>
            <a href="#" style="opacity: 0.4; pointer-events: none;">🇩🇪 Deutsch</a>
            <a href="#" style="opacity: 0.4; pointer-events: none;">🇮🇹 Italiano</a>
        </div>
    </div>

</body>
</html>
