<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabras y frases perdidas | Lost Words and Phrases</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: #e0e0e0;
        }
        p.subtitle {
            font-size: 1.1rem;
            color: #888888;
            margin-bottom: 30px;
        }
        .intro-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
        }
        .intro-video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: #000;
        }
        .intro-video-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .lang-select-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .lang-select-container a {
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            background-color: #1f1f1f;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .lang-select-container a:hover {
            background-color: #333;
            border-color: #777;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <h1>Palabras y frases perdidas</h1>
    <p class="subtitle">Collection of footprints and reflections</p>

    <div class="intro-container">
        <div class="intro-video-wrapper">
            <video autoplay loop muted playsinline>
                <source src="Intro PYFP.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de este vídeo.
            </video>
        </div>
    </div>

    <div class="lang-select-container">
        <!-- Enlaces provisionales o definitivos a los repositorios de idioma -->
        <a href="./es/">🇪🇸 Español</a>
        <a href="./en/">🇬🇧 English</a>
    </div>

</body>
</html>
