<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabras y frases perdidas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #e0e0e0;
        }
        p.subtitle {
            font-size: 1rem;
            color: #888888;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            max-width: 900px;
            width: 100%;
        }
        select, button {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 10px 16px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        select:hover, button:hover:not(:disabled) {
            background-color: #2a2a2a;
            border-color: #555555;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .info-panel {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            font-size: 0.9rem;
            color: #aaaaaa;
        }
        #loading {
            position: absolute;
            color: #ffffff;
            font-size: 1.1rem;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="appTitle">Palabras y frases perdidas</h1>
        <p id="appSubtitle" class="subtitle">Colección de huellas y reflexiones</p>
    </header>

    <div class="controls">
        <select id="blockSelect"></select>
        <button id="prevBtn">&larr; Anterior</button>
        <button id="nextBtn">Siguiente &rarr;</button>
        <button id="randomBtn">🎲 Aleatoria</button>
        <button id="langBtn">🌐 English</button>
    </div>

    <div class="canvas-container">
        <div id="loading">Cargando...</div>
        <canvas id="cardCanvas" width="1280" height="720"></canvas>
    </div>

    <div class="info-panel">
        <span id="huellaCounter">--</span>
    </div>

<script>
    const blockNames = {
        es: [
            "Bloque 1: Geometría del destino",
            "Bloque 2: Arquitectura del alma",
            "Bloque 3: Anatomía del silencio",
            "Bloque 4: El Miedo y sus Sombras",
            "Bloque 5: La Mirada del Mundo",
            "Bloque 6: El Ruido de los Necios",
            "Bloque 7: El Cielo de las Estrellas",
            "Bloque 8: La Ética del Corazón",
            "Bloque 9: El Tiempo que Respira",
            "Bloque 10: El Juego de Vivir",
            "Bloque 11: El latido de la libertad",
            "Bloque 12: La Razón y el Corazón",
            "Bloque 13: El Universo de las Palabras",
            "Bloque 14: La Soledad que Habla"
        ],
        en: [
            "Block 1: Geometry of Destiny",
            "Block 2: Architecture of the Soul",
            "Block 3: Anatomy of Silence",
            "Block 4: Fear and Its Shadows",
            "Block 5: The World's Gaze",
            "Block 6: The Noise of Fools",
            "Block 7: The Sky of Stars",
            "Block 8: Ethics of the Heart",
            "Block 9: Time That Breathes",
            "Block 10: The Game of Living",
            "Block 11: The Pulse of Freedom",
            "Block 12: Reason and Heart",
            "Block 13: Universe of Words",
            "Block 14: Solitude That Speaks"
        ]
    };

    const translations = {
        es: {
            title: "Palabras y frases perdidas",
            subtitle: "Colección de huellas y reflexiones",
            random: "🎲 Aleatoria",
            langBtn: "🌐 English",
            prev: "&larr; Anterior",
            next: "Siguiente &rarr;",
            loading: "Cargando...",
            noFootprints: "Sin huellas en este bloque",
            footprintLabel: "Huella"
        },
        en: {
            title: "Lost Words and Phrases",
            subtitle: "Collection of footprints and reflections",
            random: "🎲 Random",
            langBtn: "🌐 Español",
            prev: "&larr; Previous",
            next: "Next &rarr;",
            loading: "Loading...",
            noFootprints: "No footprints in this block",
            footprintLabel: "Footprint"
        }
    };

    let currentLang = 'es';
    let allFrases = [];
    let currentFilteredFrases = [];
    let currentIndex = 0;
    let animationFrameId = null;
    let currentVideoElem = null;

    let canvas, ctx, blockSelect, prevBtn, nextBtn, randomBtn, langBtn, huellaCounter, loadingElem, appTitle, appSubtitle;

    function getTemplateConfig(blockNum, lang) {
        const imgSuffix = (lang === 'en') ? '_en' : '';
        return {
            img: `plantilla${blockNum}${imgSuffix}.png`,
            video: `plantilla${blockNum}_video.mp4`
        };
    }

    function populateSelect() {
        if (!blockSelect) return;
        const currentVal = blockSelect.value || "1";
        blockSelect.innerHTML = "";
        const names = blockNames[currentLang];
        names.forEach((name, index) => {
            const opt = document.createElement('option');
            opt.value = (index + 1).toString();
            opt.textContent = name;
            if ((index + 1).toString() === currentVal) {
                opt.selected = true;
            }
            blockSelect.appendChild(opt);
        });
    }

    function updateUIStrings() {
        const t = translations[currentLang];
        if (appTitle) appTitle.textContent = t.title;
        if (appSubtitle) appSubtitle.textContent = t.subtitle;
        if (randomBtn) randomBtn.innerHTML = t.random;
        if (langBtn) langBtn.innerHTML = t.langBtn;
        if (prevBtn) prevBtn.innerHTML = t.prev;
        if (nextBtn) nextBtn.innerHTML = t.next;
        populateSelect();
    }

    function toggleLanguage() {
        currentLang = (currentLang === 'es') ? 'en' : 'es';
        updateUIStrings();
        const fileToLoad = (currentLang === 'es') ? 'frases.json' : 'frases_en.json';
        loadData(fileToLoad);
    }

    async function loadData(file) {
        const t = translations[currentLang];
        if (loadingElem) {
            loadingElem.style.display = 'block';
            loadingElem.textContent = t.loading;
        }
        try {
            const response = await fetch(file + '?t=' + Date.now());
            if (!response.ok) throw new Error("Error HTTP " + response.status);
            allFrases = await response.json();
            if (loadingElem) loadingElem.style.display = 'none';

            const activeBlock = blockSelect.value || "1";
            filterByBlock(parseInt(activeBlock, 10));
        } catch (error) {
            console.error("Error al cargar datos:", error);
            if (loadingElem) {
                loadingElem.style.display = 'block';
                loadingElem.textContent = "Error al cargar " + file;
            }
        }
    }

    function filterByBlock(blockNum) {
        // Conversión limpia a número para evitar discrepancias tipo string vs number
        currentFilteredFrases = allFrases.filter(f => Number(f.bloque) === Number(blockNum));
        currentIndex = 0;

        if (currentFilteredFrases.length === 0) {
            stopAnimation();
            if (huellaCounter) huellaCounter.textContent = translations[currentLang].noFootprints;
            if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
            return;
        }

        renderCurrentHuella();
    }

    function stopAnimation() {
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
        if (currentVideoElem) {
            currentVideoElem.pause();
            currentVideoElem.removeAttribute('src');
            currentVideoElem.load();
            currentVideoElem = null;
        }
    }

    function renderCurrentHuella() {
        if (currentFilteredFrases.length === 0) return;

        stopAnimation();

        const item = currentFilteredFrases[currentIndex];
        const config = getTemplateConfig(item.bloque, currentLang);
        const label = translations[currentLang].footprintLabel;

        if (huellaCounter) {
            huellaCounter.textContent = `${label} ${item.id} (${currentIndex + 1} / ${currentFilteredFrases.length})`;
        }
        if (prevBtn) prevBtn.disabled = currentIndex === 0;
        if (nextBtn) nextBtn.disabled = currentIndex === currentFilteredFrases.length - 1;

        // Dibujar primero la imagen base para garantizar visualización instantánea
        const bgImg = new Image();
        bgImg.src = config.img;
        bgImg.onload = () => {
            drawCanvasFrame(bgImg, item.texto);
            tryLoadVideo(config.video, item.texto, bgImg);
        };
        bgImg.onerror = () => {
            // Reintento con plantilla predeterminada si falta la variante traducida
            if (config.img.includes('_en.png')) {
                const fallbackImg = new Image();
                fallbackImg.src = `plantilla${item.bloque}.png`;
                fallbackImg.onload = () => {
                    drawCanvasFrame(fallbackImg, item.texto);
                    tryLoadVideo(config.video, item.texto, fallbackImg);
                };
                fallbackImg.onerror = () => drawTextOnly(item.texto);
            } else {
                drawTextOnly(item.texto);
            }
        };
    }

    function tryLoadVideo(videoSrc, text, fallbackImg) {
        const video = document.createElement('video');
        video.src = videoSrc;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;

        video.oncanplay = () => {
            currentVideoElem = video;
            video.play().then(() => {
                function loop() {
                    if (currentVideoElem === video && ctx && canvas) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        drawTextOverlay(text);
                        animationFrameId = requestAnimationFrame(loop);
                    }
                }
                loop();
            }).catch(() => {
                // Si el navegador impide el autoplay, se mantiene la imagen cargada
                drawCanvasFrame(fallbackImg, text);
            });
        };
    }

    function drawCanvasFrame(bgImg, text) {
        if (!ctx || !canvas) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        drawTextOverlay(text);
    }

    function drawTextOnly(text) {
        if (!ctx || !canvas) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawTextOverlay(text);
    }

    function drawTextOverlay(text) {
        if (!ctx || !canvas) return;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const maxWidth = 820;
        const lineHeight = 65;
        const x = canvas.width / 2;
        const y = canvas.height / 2;

        let fontSize = 42;
        if (text.length > 150) fontSize = 36;
        if (text.length > 250) fontSize = 32;

        ctx.font = `400 ${fontSize}px 'Montserrat', sans-serif`;

        const words = text.split(' ');
        let lines = [];
        let currentLine = words[0];

        for (let i = 1; i < words.length; i++) {
            let word = words[i];
            let width = ctx.measureText(currentLine + " " + word).width;
            if (width < maxWidth) {
                currentLine += " " + word;
            } else {
                lines.push(currentLine);
                currentLine = word;
            }
        }
        lines.push(currentLine);

        const totalHeight = lines.length * lineHeight;
        let startY = y - (totalHeight / 2) + (lineHeight / 2);

        lines.forEach((line, index) => {
            ctx.fillText(line, x, startY + (index * lineHeight));
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        canvas = document.getElementById('cardCanvas');
        ctx = canvas ? canvas.getContext('2d') : null;
        blockSelect = document.getElementById('blockSelect');
        prevBtn = document.getElementById('prevBtn');
        nextBtn = document.getElementById('nextBtn');
        randomBtn = document.getElementById('randomBtn');
        langBtn = document.getElementById('langBtn');
        huellaCounter = document.getElementById('huellaCounter');
        loadingElem = document.getElementById('loading');
        appTitle = document.getElementById('appTitle');
        appSubtitle = document.getElementById('appSubtitle');

        updateUIStrings();

        if (blockSelect) {
            blockSelect.addEventListener('change', (e) => {
                filterByBlock(parseInt(e.target.value, 10));
            });
        }

        if (prevBtn) {
            prevBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentIndex > 0) {
                    currentIndex--;
                    renderCurrentHuella();
                }
            });
        }

        if (nextBtn) {
            nextBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentIndex < currentFilteredFrases.length - 1) {
                    currentIndex++;
                    renderCurrentHuella();
                }
            });
        }

        if (randomBtn) {
            randomBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (allFrases.length === 0) return;
                const randomIndex = Math.floor(Math.random() * allFrases.length);
                const randomItem = allFrases[randomIndex];
                
                blockSelect.value = randomItem.bloque.toString();
                currentFilteredFrases = allFrases.filter(f => Number(f.bloque) === Number(randomItem.bloque));
                currentIndex = currentFilteredFrases.findIndex(f => f.id === randomItem.id);
                if (currentIndex === -1) currentIndex = 0;
                renderCurrentHuella();
            });
        }

        if (langBtn) {
            langBtn.addEventListener('click', (e) => {
                e.preventDefault();
                toggleLanguage();
            });
        }

        loadData('frases.json');
    });
</script>
</body>
</html>
