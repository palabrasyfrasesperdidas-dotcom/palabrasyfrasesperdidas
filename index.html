<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabras y frases perdidas</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161a22;
            --accent-gold: #c5a059;
            --accent-gold-hover: #e0b868;
            --text-main: #f0f3f8;
            --text-muted: #8b949e;
            --border-color: #2e3643;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            overflow-x: hidden;
        }

        body.intro-active {
            overflow: hidden;
        }

        /* ----- PANTALLA INICIAL (VIDEO / PORTADA) ----- */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ajusta el vídeo entero sin recortar la marca ni la pluma */
            background-color: #000;
        }

        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 101;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 40px;
            transition: opacity 0.5s ease;
        }

        .language-container {
            text-align: center;
            width: 90%;
            max-width: 360px;
        }

        .language-title {
            color: #f0f3f8;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-lang {
            background: rgba(22, 26, 34, 0.9);
            color: #c5a059;
            border: 1px solid #c5a059;
            padding: 12px 20px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-lang:hover {
            background: #c5a059;
            color: #0d0f12;
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.6);
        }

        /* ----- APLICACIÓN PRINCIPAL ----- */
        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .controls-top {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        select {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }

        .btn-action {
            background-color: var(--card-bg);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 8px 14px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-action:hover {
            background-color: var(--accent-gold);
            color: var(--bg-color);
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px var(--shadow-color);
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .controls-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 420px;
            margin-top: 15px;
        }

        .btn-nav {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .counter {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent-gold);
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="intro-active">

    <div class="video-background" id="videoBg">
        <video autoplay loop muted playsinline poster="Intro PYFP.png">
            <source src="Intro PYFP.mp4" type="video/mp4">
        </video>
    </div>

    <div class="intro-overlay" id="introOverlay">
        <div class="language-container">
            <p class="language-title">Selecciona tu idioma / Select language</p>
            <div class="btn-group">
                <button class="btn-lang" onclick="selectLanguage('es')">Español</button>
                <button class="btn-lang" onclick="selectLanguage('en')">English (Próximamente)</button>
            </div>
        </div>
    </div>

    <header>
        <h1>Palabras y frases perdidas</h1>
        <p>Colección de huellas y reflexiones</p>
    </header>

    <div class="controls-top">
        <select id="blockSelect">
            <option value="1" selected>Bloque 1: Geometría del destino</option>
            <option value="2">Bloque 2: Arquitectura del alma</option>
            <option value="3">Bloque 3: Anatomía del silencio</option>
            <option value="4">Bloque 4: El Miedo y sus Sombras</option>
            <option value="5">Bloque 5: La Mirada del Mundo</option>
            <option value="6">Bloque 6: El Ruido de los Necios</option>
            <option value="7">Bloque 7: El Cielo de las Estrellas</option>
            <option value="8">Bloque 8: La Ética del Corazón</option>
            <option value="9">Bloque 9: El Tiempo que Respira</option>
            <option value="10">Bloque 10: El Juego de Vivir</option>
            <option value="11">Bloque 11: El latido de la libertad</option>
            <option value="12">Bloque 12: La Razón y el Corazón</option>
            <option value="13">Bloque 13: El Universo de las Palabras</option>
            <option value="14">Bloque 14: La Soledad que Habla</option>
        </select>

        <button class="btn-action" id="randomBtn">🎲 Aleatoria</button>
        <button class="btn-action" onclick="showLanguageScreen()">🌐 Idioma</button>
    </div>

    <div class="canvas-container">
        <div id="loading" class="loading">Cargando huellas...</div>
        <canvas id="cardCanvas" width="1080" height="1920"></canvas>
    </div>

    <div class="controls-bottom">
        <button class="btn-nav" id="prevBtn">&larr; Anterior</button>
        <div class="counter" id="huellaCounter">Huella --</div>
        <button class="btn-nav" id="nextBtn">Siguiente &rarr;</button>
    </div>

    <script>
        // Mapeo flexible adaptado a mayúsculas/minúsculas exactas del repositorio
        const blockTemplates = {
            1: 'plantilla1.png', 2: 'plantilla2.png', 3: 'plantilla3.png',
            4: 'Plantilla4.png', 5: 'plantilla5.png', 6: 'plantilla6.png',
            7: 'plantilla7.png', 8: 'plantilla8.png', 9: 'plantilla9.png',
            10: 'plantilla10.png', 11: 'plantilla11.png', 12: 'plantilla12.png',
            13: 'plantilla13.png', 14: 'plantilla14.png'
        };

        let currentLang = 'es';
        let allFrases = [];
        let currentFilteredFrases = [];
        let currentIndex = 0;
        let loadedImages = {};

        const canvas = document.getElementById('cardCanvas');
        const ctx = canvas.getContext('2d');
        const blockSelect = document.getElementById('blockSelect');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const randomBtn = document.getElementById('randomBtn');
        const huellaCounter = document.getElementById('huellaCounter');
        const loadingElem = document.getElementById('loading');

        function selectLanguage(lang) {
            currentLang = lang;
            document.body.classList.remove('intro-active');
            document.getElementById('introOverlay').style.display = 'none';
            document.getElementById('videoBg').style.display = 'none';

            const fileToLoad = (lang === 'es') ? 'frases.json' : `frases_${lang}.json`;
            loadData(fileToLoad);
        }

        function showLanguageScreen() {
            document.body.classList.add('intro-active');
            document.getElementById('introOverlay').style.display = 'flex';
