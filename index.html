<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabras y frases perdidas</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161a22;
            --accent-gold: #c5a059;
            --text-main: #f0f3f8;
            --text-muted: #8b949e;
            --border-color: #2e3643;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            overflow-x: hidden;
        }

        body.intro-active {
            overflow: hidden;
        }

        /* ----- PORTADA CON VIDEO ----- */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
        }

        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 101;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 40px;
        }

        .language-container {
            text-align: center;
            width: 90%;
            max-width: 360px;
        }

        .language-title {
            color: #f0f3f8;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-lang {
            background: rgba(22, 26, 34, 0.9);
            color: #c5a059;
            border: 1px solid #c5a059;
            padding: 12px 20px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-lang:hover {
            background: #c5a059;
            color: #0d0f12;
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.6);
        }

        /* ----- APLICACIÓN PRINCIPAL ----- */
        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .controls-top {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        select {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }

        .btn-action {
            background-color: var(--card-bg);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 8px 14px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-action:hover {
            background-color: var(--accent-gold);
            color: var(--bg-color);
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px var(--shadow-color);
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .controls-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 420px;
            margin-top: 15px;
        }

        .btn-nav {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .counter {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent-gold);
            font-size: 0.9rem;
            text-align: center;
            width: 90%;
            z-index: 10;
        }
    </style>
</head>
<body class="intro-active">

    <div class="video-background" id="videoBg">
        <video autoplay loop muted playsinline poster="Intro PYFP.png">
            <source src="Intro PYFP.mp4" type="video/mp4">
        </video>
    </div>

    <div class="intro-overlay" id="introOverlay">
        <div class="language-container">
            <p class="language-title">Selecciona tu idioma / Select language</p>
            <div class="btn-group">
                <button class="btn-lang" onclick="selectLanguage('es')">Español</button>
                <button class="btn-lang" onclick="selectLanguage('en')">English (Próximamente)</button>
            </div>
        </div>
    </div>

    <header>
        <h1>Palabras y frases perdidas</h1>
        <p>Colección de huellas y reflexiones</p>
    </header>

    <div class="controls-top">
        <select id="blockSelect">
            <option value="1" selected>Bloque 1: Geometría del destino</option>
            <option value="2">Bloque 2: Arquitectura del alma</option>
            <option value="3">Bloque 3: Anatomía del silencio</option>
            <option value="4">Bloque 4: El Miedo y sus Sombras</option>
            <option value="5">Bloque 5: La Mirada del Mundo</option>
            <option value="6">Bloque 6: El Ruido de los Necios</option>
            <option value="7">Bloque 7: El Cielo de las Estrellas</option>
            <option value="8">Bloque 8: La Ética del Corazón</option>
            <option value="9">Bloque 9: El Tiempo que Respira</option>
            <option value="10">Bloque 10: El Juego de Vivir</option>
            <option value="11">Bloque 11: El latido de la libertad</option>
            <option value="12">Bloque 12: La Razón y el Corazón</option>
            <option value="13">Bloque 13: El Universo de las Palabras</option>
            <option value="14">Bloque 14: La Soledad que Habla</option>
        </select>

        <button class="btn-action" id="randomBtn">🎲 Aleatoria</button>
        <button class="btn-action" onclick="showLanguageScreen()">🌐 Idioma</button>
    </div>

    <div class="canvas-container">
        <div id="loading" class="loading">Cargando huellas...</div>
        <canvas id="cardCanvas" width="1080" height="1920"></canvas>
    </div>

    <div class="controls-bottom">
        <button class="btn-nav" id="prevBtn">&larr; Anterior</button>
        <div class="counter" id="huellaCounter">Huella --</div>
        <button class="btn-nav" id="nextBtn">Siguiente &rarr;</button>
    </div>

    <script>
        // Mapeo dinámico de plantillas de vídeo e imagen por bloque
        const blockTemplates = {
            1: { img: 'plantilla1.png', video: 'plantilla1_video.mp4' },
            2: { img: 'plantilla2.png', video: 'plantilla2_video.mp4' },
            3: { img: 'plantilla3.png', video: 'plantilla3_video.mp4' },
            4: { img: 'plantilla4.png', video: 'plantilla4_video.mp4' },
            5: { img: 'plantilla5.png', video: 'plantilla5_video.mp4' },
            6: { img: 'plantilla6.png', video: 'plantilla6_video.mp4' },
            7: { img: 'plantilla7.png', video: 'plantilla7_video.mp4' },
            8: { img: 'plantilla8.png', video: 'plantilla8_video.mp4' },
            9: { img: 'plantilla9.png', video: 'plantilla9_video.mp4' },
            10: { img: 'plantilla10.png', video: 'plantilla10_video.mp4' },
            11: { img: 'plantilla11.png', video: 'plantilla11_video.mp4' },
            12: { img: 'plantilla12.png', video: 'plantilla12_video.mp4' },
            13: { img: 'plantilla13.png', video: 'plantilla13_video.mp4' },
            14: { img: 'plantilla14.png', video: 'plantilla14_video.mp4' }
        };

        let currentLang = 'es';
        let allFrases = [];
        let currentFilteredFrases = [];
        let currentIndex = 0;
        
        let loadedImages = {};
        let loadedVideos = {};
        let activeVideo = null;
        let animationFrameId = null;
        let useFallbackImage = false;

        const canvas = document.getElementById('cardCanvas');
        const ctx = canvas.getContext('2d');
        const blockSelect = document.getElementById('blockSelect');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const randomBtn = document.getElementById('randomBtn');
        const huellaCounter = document.getElementById('huellaCounter');
        const loadingElem = document.getElementById('loading');

        function selectLanguage(lang) {
            currentLang = lang;
            document.body.classList.remove('intro-active');
            document.getElementById('introOverlay').style.display = 'none';
            document.getElementById('videoBg').style.display = 'none';

            const fileToLoad = (lang === 'es') ? 'frases.json' : `frases_${lang}.json`;
            loadData(fileToLoad);
        }

        function showLanguageScreen() {
            document.body.classList.add('intro-active');
            document.getElementById('introOverlay').style.display = 'flex';
            document.getElementById('videoBg').style.display = 'flex';
        }

        async function loadData(file) {
            loadingElem.style.display = 'block';
            loadingElem.textContent = "Cargando huellas...";
            try {
                const response = await fetch(file + '?v=' + new Date().getTime());
                if (!response.ok) throw new Error("No se encuentra el archivo " + file);
                allFrases = await response.json();
                loadingElem.style.display = 'none';
                filterByBlock(parseInt(blockSelect.value));
            } catch (error) {
                console.error("Error al cargar frases:", error);
                loadingElem.style.display = 'block';
                loadingElem.textContent = "Error al leer " + file + ". Revisa que no tenga comas sobrantes.";
            }
        }

        function filterByBlock(blockNum) {
            currentFilteredFrases = allFrases.filter(f => Number(f.bloque) === Number(blockNum));
            currentIndex = 0;

            if (currentFilteredFrases.length === 0) {
                stopAnimation();
                huellaCounter.textContent = "Sin huellas en este bloque";
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            renderCurrentHuella();
        }

        function stopAnimation() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            if (activeVideo) {
                activeVideo.pause();
                activeVideo = null;
            }
        }

        function renderCurrentHuella() {
            if (currentFilteredFrases.length === 0) return;

            stopAnimation();

            const item = currentFilteredFrases[currentIndex];
            const config = blockTemplates[item.bloque] || { img: 'plantilla1.png', video: 'plantilla1_video.mp4' };

            huellaCounter.textContent = `Huella ${item.id} (${currentIndex + 1} de ${currentFilteredFrases.length})`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === currentFilteredFrases.length - 1;

            useFallbackImage = false;

            // Intenta reproducir el vídeo correspondiente al bloque (del 1 al 14)
            if (loadedVideos[config.video]) {
                startVideoLoop(loadedVideos[config.video], item.texto);
            } else {
                const vid = document.createElement('video');
                vid.src = config.video;
                vid.autoplay = true;
                vid.loop = true;
                vid.muted = true;
                vid.playsInline = true;

                vid.oncanplay = () => {
                    loadedVideos[config.video] = vid;
                    if (!useFallbackImage) {
                        startVideoLoop(vid, item.texto);
                    }
                };

                vid.onerror = () => {
                    // Si el archivo mp4 falla o no carga, recurre automáticamente a la imagen .png estática
                    useFallbackImage = true;
                    loadFallbackImage(config.img, item.texto);
                };
            }
        }

        function startVideoLoop(videoElem, text) {
            activeVideo = videoElem;
            videoElem.play().catch(() => {
                // Si el navegador bloquea la reproducción automática de vídeo, recurre a la imagen estática
                useFallbackImage = true;
                const item = currentFilteredFrases[currentIndex];
                const config = blockTemplates[item.bloque];
                loadFallbackImage(config.img, text);
            });

            function loop() {
                if (activeVideo === videoElem && !useFallbackImage) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
                    drawTextOverlay(text);
                    animationFrameId = requestAnimationFrame(loop);
                }
            }
            loop();
        }

        function loadFallbackImage(imgPath, text) {
            if (loadedImages[imgPath]) {
                drawStaticCanvas(loadedImages[imgPath], text);
            } else {
                const img = new Image();
                img.src = imgPath;
                img.onload = () => {
                    loadedImages[imgPath] = img;
                    drawStaticCanvas(img, text);
                };
            }
        }

        function drawStaticCanvas(bgImg, text) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            drawTextOverlay(text);
        }

        function drawTextOverlay(text) {
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const maxWidth = 820;
            const lineHeight = 65;
            const x = canvas.width / 2;
            const y = canvas.height / 2;

            let fontSize = 42;
            if (text.length > 150) fontSize = 36;
            if (text.length > 250) fontSize = 32;

            ctx.font = `400 ${fontSize}px 'Montserrat', sans-serif`;

            const words = text.split(' ');
            let lines = [];
            let currentLine = words[0];

            for (let i = 1; i < words.length; i++) {
                let word = words[i];
                let width = ctx.measureText(currentLine + " " + word).width;
                if (width < maxWidth) {
                    currentLine += " " + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);

            const totalHeight = lines.length * lineHeight;
            let startY = y - (totalHeight / 2) + (lineHeight / 2);

            lines.forEach((line, index) => {
                ctx.fillText(line, x, startY + (index * lineHeight));
            });
        }

        blockSelect.addEventListener('change', (e) => {
            filterByBlock(parseInt(e.target.value));
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderCurrentHuella();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < currentFilteredFrases.length - 1) {
                currentIndex++;
                renderCurrentHuella();
            }
        });

        randomBtn.addEventListener('click', () => {
            if (allFrases.length === 0) return;
            const randomIndex = Math.floor(Math.random() * allFrases.length);
            const randomItem = allFrases[randomIndex];
            
            blockSelect.value = randomItem.bloque;
            filterByBlock(randomItem.bloque);
            currentIndex = currentFilteredFrases.findIndex(f => f.id === randomItem.id);
            renderCurrentHuella();
        });
    </script>
</body>
</html>
