<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabras y frases perdidas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #e0e0e0;
        }
        p.subtitle {
            font-size: 1rem;
            color: #888888;
        }
        .intro-container {
            width: 100%;
            max-width: 720px;
            margin: 10px auto;
            text-align: center;
        }
        .intro-video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: #000;
        }
        .intro-video-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .lang-select-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        .lang-select-container button {
            padding: 12px 24px;
            font-size: 1.05rem;
            font-weight: 600;
            background-color: #1f1f1f;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }
        .lang-select-container button:hover {
            background-color: #333;
            border-color: #777;
            transform: translateY(-2px);
        }
        .viewer-section {
            display: none;
            width: 100%;
            max-width: 900px;
            flex-direction: column;
            align-items: center;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            width: 100%;
        }
        select, button {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 10px 16px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            touch-action: manipulation;
        }
        select:hover, button:hover:not(:disabled) {
            background-color: #2a2a2a;
            border-color: #555555;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        .info-panel {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 480px;
            font-size: 0.9rem;
            color: #aaaaaa;
        }
        #loading {
            position: absolute;
            color: #ffffff;
            font-size: 1.1rem;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="appTitle">Palabras y frases perdidas</h1>
        <p id="appSubtitle" class="subtitle">Colección de huellas y reflexiones</p>
    </header>

    <div id="introSection" class="intro-container">
        <div class="intro-video-wrapper">
            <video id="introVideo" autoplay loop muted playsinline>
                <source src="Intro PYFP.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de este vídeo.
            </video>
        </div>
        <div class="lang-select-container">
            <button id="initEsBtn">🇪🇸 Español</button>
            <button id="initEnBtn">🇬🇧 English</button>
        </div>
    </div>

    <div id="viewerSection" class="viewer-section">
        <div class="controls">
            <button id="homeBtn">🏠 Home</button>
            <select id="blockSelect"></select>
            <button id="prevBtn">&larr; Anterior</button>
            <button id="nextBtn">Siguiente &rarr;</button>
            <button id="randomBtn">🎲 Aleatoria</button>
        </div>

        <div class="canvas-container">
            <div id="loading">Cargando...</div>
            <canvas id="cardCanvas"></canvas>
        </div>

        <div class="info-panel">
            <span id="huellaCounter">--</span>
        </div>
    </div>

<script>
    const blockNames = {
        es: [
            "Bloque 1: Geometría del destino",
            "Bloque 2: Arquitectura del alma",
            "Bloque 3: Anatomía del silencio",
            "Bloque 4: El Miedo y sus Sombras",
            "Bloque 5: La Mirada del Mundo",
            "Bloque 6: El Ruido de los Necios",
            "Bloque 7: El Cielo de las Estrellas",
            "Bloque 8: La Ética del Corazón",
            "Bloque 9: El Tiempo que Respira",
            "Bloque 10: El Juego de Vivir",
            "Bloque 11: El latido de la libertad",
            "Bloque 12: La Razón y el Corazón",
            "Bloque 13: El Universo de las Palabras",
            "Bloque 14: La Soledad que Habla"
        ],
        en: [
            "Block 1: Geometry of Destiny",
            "Block 2: Architecture of the Soul",
            "Block 3: Anatomy of Silence",
            "Block 4: Fear and Its Shadows",
            "Block 5: The World's Gaze",
            "Block 6: The Noise of Fools",
            "Block 7: The Sky of Stars",
            "Block 8: Ethics of the Heart",
            "Block 9: Time That Breathes",
            "Block 10: The Game of Living",
            "Block 11: The Pulse of Freedom",
            "Block 12: Reason and Heart",
            "Block 13: Universe of Words",
            "Block 14: Solitude That Speaks"
        ]
    };

    const translations = {
        es: {
            title: "Palabras y frases perdidas",
            subtitle: "Colección de huellas y reflexiones",
            home: "🏠 Inicio",
            random: "🎲 Aleatoria",
            prev: "&larr; Anterior",
            next: "Siguiente &rarr;",
            loading: "Cargando...",
            noFootprints: "Sin huellas en este bloque",
            footprintLabel: "Huella"
        },
        en: {
            title: "Lost Words and Phrases",
            subtitle: "Collection of footprints and reflections",
            home: "🏠 Home",
            random: "🎲 Random",
            prev: "&larr; Previous",
            next: "Next &rarr;",
            loading: "Loading...",
            noFootprints: "No footprints in this block",
            footprintLabel: "Footprint"
        }
    };

    let currentLang = sessionStorage.getItem('pyfp_lang') || 'es';
    let allFrases = [];
    let currentFilteredFrases = [];
    let currentIndex = parseInt(sessionStorage.getItem('pyfp_index') || '0', 10);
    let animationFrameId = null;
    let currentVideoElem = null;

    let canvas, ctx, blockSelect, prevBtn, nextBtn, randomBtn, homeBtn, huellaCounter, loadingElem, appTitle, appSubtitle, introSection, viewerSection;

    function populateSelect() {
        if (!blockSelect) return;
        const currentVal = blockSelect.value || sessionStorage.getItem('pyfp_block') || "1";
        blockSelect.innerHTML = "";
        const names = blockNames[currentLang];
        names.forEach((name, index) => {
            const opt = document.createElement('option');
            opt.value = (index + 1).toString();
            opt.textContent = name;
            if ((index + 1).toString() === currentVal) {
                opt.selected = true;
            }
            blockSelect.appendChild(opt);
        });
    }

    function updateUIStrings() {
        const t = translations[currentLang];
        if (appTitle) appTitle.textContent = t.title;
        if (appSubtitle) appSubtitle.textContent = t.subtitle;
        if (homeBtn) homeBtn.innerHTML = t.home;
        if (randomBtn) randomBtn.innerHTML = t.random;
        if (prevBtn) prevBtn.innerHTML = t.prev;
        if (nextBtn) nextBtn.innerHTML = t.next;
        populateSelect();
    }

    function showIntro() {
        stopAnimation();
        sessionStorage.removeItem('pyfp_active');
        if (viewerSection) viewerSection.style.display = 'none';
        if (introSection) introSection.style.display = 'block';
    }

    function startExperience(lang, restoreState = false) {
        currentLang = lang;
        sessionStorage.setItem('pyfp_lang', lang);
        sessionStorage.setItem('pyfp_active', 'true');
        
        updateUIStrings();
        if (introSection) introSection.style.display = 'none';
        if (viewerSection) viewerSection.style.display = 'flex';
        
        const fileToLoad = (currentLang === 'es') ? 'frases.json' : 'frases_en.json';
        loadData(fileToLoad, restoreState);
    }

    async function loadData(file, restoreState = false) {
        const t = translations[currentLang];
        if (loadingElem) {
            loadingElem.style.display = 'block';
            loadingElem.textContent = t.loading;
        }
        try {
            const response = await fetch(file + '?t=' + Date.now());
            if (!response.ok) throw new Error("Error HTTP " + response.status);
            allFrases = await response.json();
            if (loadingElem) loadingElem.style.display = 'none';

            let activeBlock = blockSelect.value || "1";
            if (restoreState) {
                activeBlock = sessionStorage.getItem('pyfp_block') || activeBlock;
                if (blockSelect) blockSelect.value = activeBlock;
            }

            filterByBlock(parseInt(activeBlock, 10), restoreState);
        } catch (error) {
            console.error("Error al cargar datos:", error);
            if (loadingElem) {
                loadingElem.style.display = 'block';
                loadingElem.textContent = "Error al cargar " + file;
            }
        }
    }

    function filterByBlock(blockNum, keepIndex = false) {
        sessionStorage.setItem('pyfp_block', blockNum.toString());
        currentFilteredFrases = allFrases.filter(f => Number(f.bloque) === Number(blockNum));
        
        if (!keepIndex) {
            currentIndex = 0;
        } else {
            const savedIndex = parseInt(sessionStorage.getItem('pyfp_index') || '0', 10);
            currentIndex = (savedIndex < currentFilteredFrases.length) ? savedIndex : 0;
        }

        if (currentFilteredFrases.length === 0) {
            stopAnimation();
            if (huellaCounter) huellaCounter.textContent = translations[currentLang].noFootprints;
            if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
            return;
        }

        renderCurrentHuella();
    }

    function stopAnimation() {
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
        if (currentVideoElem) {
            currentVideoElem.pause();
            currentVideoElem.removeAttribute('src');
            currentVideoElem.load();
            currentVideoElem = null;
        }
    }

    function renderCurrentHuella() {
        if (currentFilteredFrases.length === 0) return;

        stopAnimation();
        sessionStorage.setItem('pyfp_index', currentIndex.toString());

        const item = currentFilteredFrases[currentIndex];
        const label = translations[currentLang].footprintLabel;

        if (huellaCounter) {
            huellaCounter.textContent = `${label} ${item.id} (${currentIndex + 1} / ${currentFilteredFrases.length})`;
        }
        if (prevBtn) prevBtn.disabled = currentIndex === 0;
        if (nextBtn) nextBtn.disabled = currentIndex === currentFilteredFrases.length - 1;

        // Rutas corregidas para coincidir exactamente con los nombres en GitHub
        const primaryImgPath = (currentLang === 'en') ? `plantilla${item.bloque}_en.png` : `plantilla${item.bloque}.png`;
        const primaryVideoPath = (currentLang === 'en') ? `plantilla${item.bloque}_video_en.mp4` : `plantilla${item.bloque}_video.mp4`;

        const bgImg = new Image();
        bgImg.src = primaryImgPath;

        bgImg.onload = () => {
            adjustCanvasSize(bgImg.naturalWidth, bgImg.naturalHeight);
            drawCanvasFrame(bgImg, item.texto);
            tryLoadVideo(primaryVideoPath, item.texto, bgImg);
        };

        bgImg.onerror = () => {
            const fallbackImg = new Image();
            fallbackImg.src = `plantilla${item.bloque}.png`;
            fallbackImg.onload = () => {
                adjustCanvasSize(fallbackImg.naturalWidth, fallbackImg.naturalHeight);
                drawCanvasFrame(fallbackImg, item.texto);
                tryLoadVideo(primaryVideoPath, item.texto, fallbackImg);
            };
            fallbackImg.onerror = () => drawTextOnly(item.texto);
        };
    }

    function adjustCanvasSize(width, height) {
        if (!canvas) return;
        canvas.width = width || 1080;
        canvas.height = height || 1350;
    }

    function tryLoadVideo(videoSrc, text, fallbackImg) {
        const video = document.createElement('video');
        video.src = videoSrc;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;

        video.onloadeddata = () => {
            currentVideoElem = video;
            if (video.videoWidth && video.videoHeight) {
                adjustCanvasSize(video.videoWidth, video.videoHeight);
            }
            video.play().then(() => {
                function loop() {
                    if (currentVideoElem === video && ctx && canvas) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        drawTextOverlay(text);
                        animationFrameId = requestAnimationFrame(loop);
                    }
                }
                loop();
            }).catch(() => {
                drawCanvasFrame(fallbackImg, text);
            });
        };

        video.onerror = () => {
            drawCanvasFrame(fallbackImg, text);
        };
    }

    function drawCanvasFrame(bgImg, text) {
        if (!ctx || !canvas) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        drawTextOverlay(text);
    }

    function drawTextOnly(text) {
        if (!ctx || !canvas) return;
        adjustCanvasSize(1080, 1350);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawTextOverlay(text);
    }

    function drawTextOverlay(text) {
        if (!ctx || !canvas) return;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const maxWidth = canvas.width * 0.8;
        const lineHeight = canvas.height * 0.052;
        const x = canvas.width / 2;
        const y = canvas.height * 0.46;

        let fontSize = Math.round(canvas.width * 0.038);
        if (text.length > 150) fontSize = Math.round(canvas.width * 0.032);
        if (text.length > 250) fontSize = Math.round(canvas.width * 0.027);

        ctx.font = `400 ${fontSize}px 'Montserrat', sans-serif`;

        const words = text.split(' ');
        let lines = [];
        let currentLine = words[0];

        for (let i = 1; i < words.length; i++) {
            let word = words[i];
            let width = ctx.measureText(currentLine + " " + word).width;
            if (width < maxWidth) {
                currentLine += " " + word;
            } else {
                lines.push(currentLine);
                currentLine = word;
            }
        }
        lines.push(currentLine);

        const totalHeight = lines.length * lineHeight;
        let startY = y - (totalHeight / 2) + (lineHeight / 2);

        lines.forEach((line, index) => {
            ctx.fillText(line, x, startY + (index * lineHeight));
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        canvas = document.getElementById('cardCanvas');
        ctx = canvas ? canvas.getContext('2d') : null;
        blockSelect = document.getElementById('blockSelect');
        prevBtn = document.getElementById('prevBtn');
        nextBtn = document.getElementById('nextBtn');
        randomBtn = document.getElementById('randomBtn');
        homeBtn = document.getElementById('homeBtn');
        huellaCounter = document.getElementById('huellaCounter');
        loadingElem = document.getElementById('loading');
        appTitle = document.getElementById('appTitle');
        appSubtitle = document.getElementById('appSubtitle');
        introSection = document.getElementById('introSection');
        viewerSection = document.getElementById('viewerSection');

        document.getElementById('initEsBtn').addEventListener('click', () => startExperience('es'));
        document.getElementById('initEnBtn').addEventListener('click', () => startExperience('en'));

        if (homeBtn) {
            homeBtn.addEventListener('click', (e) => {
                e.preventDefault();
                showIntro();
            });
        }

        if (blockSelect) {
            blockSelect.addEventListener('change', (e) => {
                filterByBlock(parseInt(e.target.value, 10), false);
            });
        }

        if (prevBtn) {
            prevBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentIndex > 0) {
                    currentIndex--;
                    renderCurrentHuella();
                }
            });
        }

        if (nextBtn) {
            nextBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentIndex < currentFilteredFrases.length - 1) {
                    currentIndex++;
                    renderCurrentHuella();
                }
            });
        }

        if (randomBtn) {
            randomBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (allFrases.length === 0) return;
                const randomIndex = Math.floor(Math.random() * allFrases.length);
                const randomItem = allFrases[randomIndex];
                
                blockSelect.value = randomItem.bloque.toString();
                currentFilteredFrases = allFrases.filter(f => Number(f.bloque) === Number(randomItem.bloque));
                currentIndex = currentFilteredFrases.findIndex(f => f.id === randomItem.id);
                if (currentIndex === -1) currentIndex = 0;
                renderCurrentHuella();
            });
        }

        if (sessionStorage.getItem('pyfp_active') === 'true') {
            startExperience(currentLang, true);
        }
    });
</script>
</body>
</html>
