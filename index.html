<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabras y frases perdidas</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161a22;
            --accent-gold: #c5a059;
            --accent-gold-hover: #e0b868;
            --text-main: #f0f3f8;
            --text-muted: #8b949e;
            --border-color: #2e3643;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 600px;
            flex-wrap: wrap;
            justify-content: center;
        }

        select, button {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:hover, button:hover {
            border-color: var(--accent-gold);
        }

        select {
            flex: 1;
            min-width: 200px;
        }

        button {
            background-color: var(--border-color);
            font-weight: 500;
        }

        button:hover {
            background-color: var(--accent-gold);
            color: #000;
        }

        .viewer-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 10px 30px var(--shadow-color);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-wrapper {
            width: 100%;
            position: relative;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            text-align: center;
            color: #ffffff;
            font-size: 1.15rem;
            line-height: 1.6;
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
            pointer-events: none;
            padding: 10px;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 700px;
            margin-top: 5px;
        }

        .nav-btn {
            padding: 12px 24px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .counter {
            color: var(--text-muted);
            font-size: 0.85rem;
            align-self: center;
        }

        .loading {
            color: var(--accent-gold);
            font-size: 1.1rem;
            margin: 40px 0;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.6rem;
            }
            .text-overlay {
                font-size: 0.95rem;
                width: 88%;
            }
            .controls {
                flex-direction: column;
            }
            select {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Palabras y frases perdidas</h1>
        <p class="subtitle">Colección de huellas y reflexiones</p>
    </header>

    <div class="controls">
        <select id="blockSelect" onchange="changeBlock()">
            <option value="">Cargando bloques...</option>
        </select>
        <button onclick="goToRandom()">🎲 Huella Aleatoria</button>
    </div>

    <div class="viewer-container" id="viewerContainer">
        <div class="loading" id="loadingText">Cargando colección...</div>
        
        <div class="card" id="card" style="display: none;">
            <div class="image-wrapper">
                <img id="cardImage" src="" alt="Huella visual">
                <div class="text-overlay" id="cardText"></div>
            </div>
        </div>

        <div class="nav-buttons" id="navButtons" style="display: none;">
            <button class="nav-btn" onclick="prevPhrase()">← Anterior</button>
            <span class="counter" id="counterText">0 / 0</span>
            <button class="nav-btn" onclick="nextPhrase()">Siguiente →</button>
        </div>
    </div>

    <script>
        // Nombres personalizados de los bloques
        const blockNames = {
            1: "Bloque 1: El eco del silencio",
            2: "Bloque 2: Sombras del tiempo",
            3: "Bloque 3: Luces en el laberinto",
            4: "Bloque 4: Cimientos de arena",
            5: "Bloque 5: MÁSCARAS Y ESPEJOS",
            6: "Bloque 6: EL RUIDO DE LOS NECIOS"
        };

        let allPhrases = [];
        let filteredPhrases = [];
        let currentIndex = 0;

        // Cargar las frases desde frases.json
        async function loadPhrases() {
            try {
                const response = await fetch('frases.json');
                if (!response.ok) throw new Error('No se pudo cargar el archivo frases.json');
                allPhrases = await response.json();

                setupBlockSelector();
                
                // Mostrar primer bloque por defecto
                if (allPhrases.length > 0) {
                    const firstBlock = allPhrases[0].bloque;
                    document.getElementById('blockSelect').value = firstBlock;
                    filterByBlock(firstBlock);
                }

                document.getElementById('loadingText').style.display = 'none';
                document.getElementById('card').style.display = 'flex';
                document.getElementById('navButtons').style.display = 'flex';

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loadingText').innerText = 'Error al cargar los datos. Verifica que frases.json esté presente.';
            }
        }

        // Poblar el menú desplegable dinámicamente según los bloques existentes
        function setupBlockSelector() {
            const select = document.getElementById('blockSelect');
            select.innerHTML = '';

            const blocks = [...new Set(allPhrases.map(item => item.bloque))].sort((a, b) => a - b);

            blocks.forEach(blockNum => {
                const option = document.createElement('option');
                option.value = blockNum;
                option.textContent = blockNames[blockNum] || `Bloque ${blockNum}`;
                select.appendChild(option);
            });
        }

        // Filtrar frases según el bloque seleccionado
        function filterByBlock(blockNum) {
            filteredPhrases = allPhrases.filter(item => item.bloque == blockNum);
            currentIndex = 0;
            renderCard();
        }

        function changeBlock() {
            const selectedBlock = document.getElementById('blockSelect').value;
            filterByBlock(selectedBlock);
        }

        // Renderizar la tarjeta actual (Imagen + Texto)
        function renderCard() {
            if (filteredPhrases.length === 0) return;

            const current = filteredPhrases[currentIndex];
            const imgElement = document.getElementById('cardImage');
            const textElement = document.getElementById('cardText');
            const counterElement = document.getElementById('counterText');

            // Asignar plantilla correspondiente al bloque (plantilla1.png, plantilla2.png, plantilla6.png, etc.)
            imgElement.src = `plantilla${current.bloque}.png`;
            imgElement.alt = `Plantilla del Bloque ${current.bloque}`;

            // Si el objeto no tiene texto o está vacío, asumimos que es una portada/separador
            textElement.innerText = current.texto || '';

            counterElement.innerText = `Huella ${current.id || (currentIndex + 1)} (${currentIndex + 1} de ${filteredPhrases.length})`;
        }

        // Navegación
        function nextPhrase() {
            if (filteredPhrases.length === 0) return;
            currentIndex = (currentIndex + 1) % filteredPhrases.length;
            renderCard();
        }

        function prevPhrase() {
            if (filteredPhrases.length === 0) return;
            currentIndex = (currentIndex - 1 + filteredPhrases.length) % filteredPhrases.length;
            renderCard();
        }

        function goToRandom() {
            if (allPhrases.length === 0) return;
            
            // Seleccionar un elemento aleatorio de toda la colección
            const randomIndex = Math.floor(Math.random() * allPhrases.length);
            const randomItem = allPhrases[randomIndex];

            // Cambiar selector de bloque si es diferente al actual
            document.getElementById('blockSelect').value = randomItem.bloque;
            filteredPhrases = allPhrases.filter(item => item.bloque == randomItem.bloque);
            
            // Encontrar el índice dentro del bloque filtrado
            currentIndex = filteredPhrases.findIndex(item => item.id === randomItem.id);
            if (currentIndex === -1) currentIndex = 0;

            renderCard();
        }

        // Eventos de teclado para facilitar navegación con flechas
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPhrase();
            if (e.key === 'ArrowLeft') prevPhrase();
        });

        // Inicializar al cargar la página
        window.onload = loadPhrases;
    </script>
</body>
</html>
