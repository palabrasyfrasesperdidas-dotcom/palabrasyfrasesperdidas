<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabras y frases perdidas</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161a22;
            --accent-gold: #c5a059;
            --accent-gold-hover: #e0b868;
            --text-main: #f0f3f8;
            --text-muted: #8b949e;
            --border-color: #2e3643;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .controls-top {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        select {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }

        select:hover, select:focus {
            border-color: var(--accent-gold);
        }

        .btn-random {
            background-color: var(--card-bg);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-random:hover {
            background-color: var(--accent-gold);
            color: var(--bg-color);
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px var(--shadow-color);
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .controls-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 420px;
            margin-top: 15px;
        }

        .btn-nav {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-nav:hover:not(:disabled) {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .counter {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent-gold);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Palabras y frases perdidas</h1>
        <p>Colección de huellas y reflexiones</p>
    </header>

    <div class="controls-top">
        <select id="blockSelect">
            <option value="1" selected>Bloque 1: Geometría del destino</option>
            <option value="2">Bloque 2: Arquitectura del alma</option>
            <option value="3">Bloque 3: Anatomía del silencio</option>
            <option value="4">Bloque 4: El Miedo y sus Sombras</option>
            <option value="5">Bloque 5: La Mirada del Mundo</option>
            <option value="6">Bloque 6: El Ruido de los Necios</option>
            <option value="7">Bloque 7: El Cielo de las Estrellas</option>
            <option value="8">Bloque 8: La Ética del Corazón</option>
            <option value="9">Bloque 9: El Tiempo que Respira</option>
            <option value="10">Bloque 10: El Juego de Vivir</option>
        </select>

        <button class="btn-random" id="randomBtn">
            <span>🎲</span> Huella Aleatoria
        </button>
    </div>

    <div class="canvas-container">
        <div id="loading" class="loading">Cargando huellas...</div>
        <canvas id="cardCanvas" width="1080" height="1920"></canvas>
    </div>

    <div class="controls-bottom">
        <button class="btn-nav" id="prevBtn">&larr; Anterior</button>
        <div class="counter" id="huellaCounter">Huella --</div>
        <button class="btn-nav" id="nextBtn">Siguiente &rarr;</button>
    </div>

    <script>
        const blockTemplates = {
            1: 'plantilla1.png',
            2: 'plantilla2.png',
            3: 'plantilla3.png',
            4: 'plantilla4.png',
            5: 'plantilla5.png',
            6: 'plantilla6.png',
            7: 'plantilla7.png',
            8: 'plantilla8.png',
            9: 'plantilla9.png',
            10: 'plantilla10.png'
        };

        let allFrases = [];
        let currentFilteredFrases = [];
        let currentIndex = 0;
        let loadedImages = {};

        const canvas = document.getElementById('cardCanvas');
        const ctx = canvas.getContext('2d');
        const blockSelect = document.getElementById('blockSelect');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const randomBtn = document.getElementById('randomBtn');
        const huellaCounter = document.getElementById('huellaCounter');
        const loadingElem = document.getElementById('loading');

        async function loadData() {
            try {
                const response = await fetch('frases.json');
                allFrases = await response.json();
                loadingElem.style.display = 'none';
                filterByBlock(parseInt(blockSelect.value));
            } catch (error) {
                console.error("Error al cargar frases.json:", error);
                loadingElem.textContent = "Error de sintaxis en frases.json";
            }
        }

        function filterByBlock(blockNum) {
            currentFilteredFrases = allFrases.filter(f => Number(f.bloque) === Number(blockNum));
            currentIndex = 0;

            if (currentFilteredFrases.length === 0) {
                huellaCounter.textContent = "Sin huellas en este bloque";
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            renderCurrentHuella();
        }

        function renderCurrentHuella() {
            if (currentFilteredFrases.length === 0) return;

            const item = currentFilteredFrases[currentIndex];
            const templatePath = blockTemplates[item.bloque] || 'plantilla8.png';

            huellaCounter.textContent = `Huella ${item.id} (${currentIndex + 1} de ${currentFilteredFrases.length})`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === currentFilteredFrases.length - 1;

            if (loadedImages[templatePath]) {
                drawCanvas(loadedImages[templatePath], item.texto);
            } else {
                const img = new Image();
                img.src = templatePath;
                img.onload = () => {
                    loadedImages[templatePath] = img;
                    drawCanvas(img, item.texto);
                };
            }
        }

        function drawCanvas(bgImg, text) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const maxWidth = 820;
            const lineHeight = 65;
            const x = canvas.width / 2;
            const y = canvas.height / 2;

            let fontSize = 42;
            if (text.length > 150) fontSize = 36;
            if (text.length > 250) fontSize = 32;

            ctx.font = `400 ${fontSize}px 'Montserrat', sans-serif`;

            const words = text.split(' ');
            let lines = [];
            let currentLine = words[0];

            for (let i = 1; i < words.length; i++) {
                let word = words[i];
                let width = ctx.measureText(currentLine + " " + word).width;
                if (width < maxWidth) {
                    currentLine += " " + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);

            const totalHeight = lines.length * lineHeight;
            let startY = y - (totalHeight / 2) + (lineHeight / 2);

            lines.forEach((line, index) => {
                ctx.fillText(line, x, startY + (index * lineHeight));
            });
        }

        blockSelect.addEventListener('change', (e) => {
            filterByBlock(parseInt(e.target.value));
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderCurrentHuella();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < currentFilteredFrases.length - 1) {
                currentIndex++;
                renderCurrentHuella();
            }
        });

        randomBtn.addEventListener('click', () => {
            if (allFrases.length === 0) return;
            const randomIndex = Math.floor(Math.random() * allFrases.length);
            const randomItem = allFrases[randomIndex];
            
            blockSelect.value = randomItem.bloque;
            filterByBlock(randomItem.bloque);
            currentIndex = currentFilteredFrases.findIndex(f => f.id === randomItem.id);
            renderCurrentHuella();
        });

        loadData();
    </script>
</body>
</html>
