<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palabras y frases perdidas</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 2px solid #ddd;
    }
    h1 {
      margin: 0;
      color: #2c3e50;
    }
    .container {
      max-width: 800px;
      margin: 30px auto;
    }
    .phrase-card {
      background: #ffffff;
      border-left: 4px solid #3498db;
      padding: 15px 20px;
      margin-bottom: 15px;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .phrase-id {
      font-size: 0.85em;
      color: #7f8c8d;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .phrase-text {
      font-size: 1.1em;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <h1>Palabras y frases perdidas</h1>
  </header>

  <div class="container" id="phrases-container">
    <!-- Aquí se cargarán las frases dinámicamente -->
  </div>

  <script>
    // Asumiendo que guardas tus frases en un archivo llamado 'frases.json'
fetch('frases.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('phrases-container');
        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'phrase-card';
          
          card.innerHTML = `
            <div class="phrase-id">Huella #${item.id}</div>
            <div class="phrase-text">${item.texto}</div>
          `;
          
          container.appendChild(card);
        });
      })
      .catch(error => console.error('Error al cargar el JSON:', error));
  </script>

</body>
</html>
