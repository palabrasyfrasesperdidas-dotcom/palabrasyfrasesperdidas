<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palabras y frases perdidas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      margin-bottom: 20px;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: #e0e0e0;
    }
    .main-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      background-color: #000;
    }
    .template-img {
      width: 100%;
      height: auto;
      display: block;
      transition: opacity 0.4s ease;
    }
    .content-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 30px;
      text-align: center;
      background: rgba(0, 0, 0, 0.4);
    }
    .phrase-number {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #a3e635;
      margin-bottom: 8px;
    }
    .filter-container {
      margin-bottom: 15px;
    }
    select {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(163, 230, 53, 0.5);
      color: #a3e635;
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      outline: none;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }
    select:hover {
      border-color: #a3e635;
      background: rgba(0, 0, 0, 0.8);
    }
    .phrase-text {
      font-size: 1.2rem;
      line-height: 1.6;
      font-weight: 300;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      margin-bottom: 25px;
    }
    .controls {
      display: flex;
      gap: 12px;
    }
    button {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }
    button:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: #a3e635;
      color: #a3e635;
    }
  </style>
</head>
<body>

  <header>
    <h1>Palabras y frases perdidas</h1>
  </header>

  <div class="main-container">
    <!-- Imagen dinámica según el bloque de la frase -->
    <img id="bg-image" src="plantilla1.png" alt="Plantilla" class="template-img">
    
    <div class="content-overlay">
      <div id="phrase-id" class="phrase-number">Cargando...</div>
      
      <!-- Selector de Bloque -->
      <div class="filter-container">
        <select id="block-select">
          <option value="todos">Todos los bloques</option>
          <!-- Los bloques disponibles se añadirán dinámicamente -->
        </select>
      </div>

      <div id="phrase-text" class="phrase-text">Cargando huellas...</div>
      
      <div class="controls">
        <button id="prev-btn">Anterior</button>
        <button id="random-btn">Aleatoria</button>
        <button id="next-btn">Siguiente</button>
      </div>
    </div>
  </div>

  <script>
    let todasLasFrases = [];
    let listaActual = [];
    let currentIndex = 0;

    const idElement = document.getElementById('phrase-id');
    const textElement = document.getElementById('phrase-text');
    const bgImage = document.getElementById('bg-image');
    const blockSelect = document.getElementById('block-select');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const randomBtn = document.getElementById('random-btn');

    // Mezcla proporcional (Fisher-Yates)
    function mezclarProporcional(array) {
      let copia = [...array];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    fetch('frases.json')
      .then(response => response.json())
      .then(data => {
        if (data && data.length > 0) {
          todasLasFrases = data;
          
          // Detectar bloques únicos presentes en el JSON y poblar el desplegable
          poblarSelectorBloques();

          // Por defecto arranca con la mezcla proporcional de todos los bloques
          aplicarFiltro("todos");
        } else {
          idElement.textContent = "Sin datos";
          textElement.textContent = "El archivo frases.json está vacío.";
        }
      })
      .catch(error => {
        console.error('Error al cargar frases:', error);
        idElement.textContent = "Error";
        textElement.textContent = "Hubo un problema al cargar el archivo JSON.";
      });

    function poblarSelectorBloques() {
      // Extrae los números de bloque sin duplicados y ordenados
      const bloquesUnicos = [...new Set(todasLasFrases.map(f => f.bloque))].sort((a, b) => a - b);
      
      bloquesUnicos.forEach(b => {
        if (b) {
          const option = document.createElement('option');
          option.value = b;
          option.textContent = `Bloque ${b}`;
          blockSelect.appendChild(option);
        }
      });
    }

    function aplicarFiltro(bloque) {
      if (bloque === "todos") {
        listaActual = mezclarProporcional(todasLasFrases);
      } else {
        // Filtra únicamente las frases del bloque seleccionado (sin desordenar para mantener el orden de huella)
        listaActual = todasLasFrases.filter(f => f.bloque == bloque);
      }
      showPhrase(0);
    }

    function showPhrase(index) {
      if (index >= 0 && index < listaActual.length) {
        currentIndex = index;
        const item = listaActual[currentIndex];

        idElement.textContent = `Huella #${item.id}`;
        textElement.textContent = `"${item.texto}"`;

        // Asignar dinámicamente la plantilla asociada a cada bloque
        if (item.bloque) {
          bgImage.src = `plantilla${item.bloque}.png`;
        }
      }
    }

    // Eventos
    blockSelect.addEventListener('change', (e) => {
      aplicarFiltro(e.target.value);
    });

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) showPhrase(currentIndex - 1);
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < listaActual.length - 1) showPhrase(currentIndex + 1);
    });

    randomBtn.addEventListener('click', () => {
      const randomIndex = Math.floor(Math.random() * listaActual.length);
      showPhrase(randomIndex);
    });
  </script>

</body>
</html>
